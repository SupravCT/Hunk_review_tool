services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hunkuser
      POSTGRES_PASSWORD: hunkpass
      POSTGRES_DB: hunkreview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hunkuser:hunkpass@db:5432/hunkreview
      GROK_API_KEY: ${GROK_API_KEY}
      GROK_BASE_URL: ${GROK_BASE_URL}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: